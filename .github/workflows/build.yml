# Build and test on every push and pull request – all tests, the Desktop ones (real windows, the real clipboard)
# in a step of their own, so a red run says at once which part it is. A version tag is set only after this is green.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test (without Desktop)
        run: dotnet test --configuration Release --no-build --filter "Category!=Desktop" --logger "trx;LogFileName=results.trx"

      - name: Test (Desktop)
        run: dotnet test tests/UeBar.App.Tests --configuration Release --no-build --filter "Category=Desktop" --logger "trx;LogFileName=desktop.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            plugins/**/TestResults/*.trx
