# On a tag v*: build installer + portable executable, the SDK package and the plugin ZIPs
# (sample plugin, test module) and attach them to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props" }

      - name: Build, test and package
        shell: pwsh
        run: ./build/publish.ps1

      # Test logs need a sign-in on GitHub – the results as an artifact make a red run readable.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            plugins/**/TestResults/*.trx

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ue Bar ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ueBar-Setup-*.exe
            dist/ueBar-*-portable.exe
            dist/UeBar.Sdk.*.nupkg
            dist/ueBar-plugin-*.zip
